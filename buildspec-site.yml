version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - npm install --global bun@1.3.14
  pre_build:
    commands:
      - bun install --frozen-lockfile
  build:
    commands:
      - bun run build
  post_build:
    commands:
      - aws s3 sync dist/_astro "s3://$SITE_BUCKET/_astro" --size-only --cache-control "public, max-age=31536000, immutable"
      - aws s3 sync dist "s3://$SITE_BUCKET" --delete --exclude "_astro/*" --cache-control "public, max-age=300"
      - aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/*"

cache:
  paths:
    - node_modules/**/*
