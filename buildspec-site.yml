version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - npm install --global bun@1.3.14
  pre_build:
    commands:
      - bun install --frozen-lockfile
  build:
    commands:
      - bun run build
  post_build:
    commands:
      - |
        if [ "$CODEBUILD_BUILD_SUCCEEDING" = "1" ]; then
          set -e
          aws s3 sync dist/_astro "s3://$SITE_BUCKET/_astro" --size-only --cache-control "public, max-age=31536000, immutable"
          aws s3 sync dist "s3://$SITE_BUCKET" --delete --exclude "_astro/*" --cache-control "public, max-age=300"
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/" "/index.html" "/404.html" "/about*" "/photography*" "/store*" "/purchase*" "/rss.xml" "/robots.txt" "/favicon.svg" "/sitemap*" "/downloads-catalog.json" \
            --query 'Invalidation.Id' --output text)
          aws cloudfront wait invalidation-completed \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --id "$INVALIDATION_ID"
          MEDIA_BUCKET="$MEDIA_BUCKET" bun scripts/photos-gc.mjs
        fi
