name: PR

on:
  pull_request:

# Read-only, and deliberately no `id-token: write`. This workflow runs code
# from pull requests, including forks once the repo is public, so it must never
# be able to assume the AWS deploy role.
permissions:
  contents: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Scan commits for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14 # Keep this in sync with buildspec-site.yml.

      - run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun audit

      - name: Test
        run: bun test

      - name: Reject authored JavaScript
        run: bun run check:typescript-policy

      - name: Check Astro and TypeScript
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Build commerce Lambdas
        run: bun run lambda:build

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2

      - name: Check Terraform formatting
        run: terraform -chdir=infra fmt -check

      - name: Validate Terraform
        run: |
          terraform -chdir=infra init -backend=false
          terraform -chdir=infra validate
