name: PR

on:
  pull_request:

# Read-only, and deliberately no `id-token: write`. This workflow runs code
# from pull requests, including forks once the repo is public, so it must never
# be able to assume the AWS deploy role.
permissions:
  contents: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14 # matches buildspec-site.yml

      - run: bun install --frozen-lockfile

      - name: Test
        run: bun test

      - name: Build
        run: bun run build
