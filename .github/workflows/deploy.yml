name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # OIDC token for assuming the AWS deploy role
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      # Credentials come before the build: originals are pulled from S3.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      # Moving caches: each run restores the newest snapshot and saves its own,
      # so `s3 sync` only downloads new photos and sharp only encodes them.
      # Images only — never cache markdown, which lives in git and must win.
      - name: Restore originals cache
        uses: actions/cache@v4
        with:
          path: |
            content/albums/**/*.jpg
            content/albums/**/*.jpeg
            content/albums/**/*.png
            content/albums/**/*.webp
            content/albums/**/*.avif
          key: originals-${{ github.run_id }}
          restore-keys: originals-

      # Encode cache lives in S3, not actions/cache: GitHub evicts caches idle
      # for 7 days, which a monthly-post cadence would miss every time.
      - name: Pull image-transform cache
        run: aws s3 sync s3://adamficke-com-originals/cache/astro node_modules/.astro --size-only

      # --delete here (not in the local script) so photos removed from the
      # archive drop out of the cached copy; markdown is outside the filters.
      - name: Pull originals from S3
        run: |
          aws s3 sync s3://adamficke-com-originals/albums content/albums --delete \
            --exclude '*' --include '*.jpg' --include '*.jpeg' --include '*.png' \
            --include '*.webp' --include '*.avif'

      - run: bun run build

      # --delete prunes entries for photos/settings that no longer exist.
      - name: Push image-transform cache
        run: aws s3 sync node_modules/.astro s3://adamficke-com-originals/cache/astro --size-only --delete

      # Hashed assets are immutable; everything else gets a short TTL.
      - name: Sync to S3
        run: |
          aws s3 sync dist/_astro "s3://$BUCKET/_astro" --size-only \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 sync dist "s3://$BUCKET" --delete --exclude "_astro/*" \
            --cache-control "public, max-age=300"
        env:
          BUCKET: ${{ vars.SITE_BUCKET }}

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
