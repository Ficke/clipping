name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # This token is required to assume the AWS deploy role.
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # First step, so a dispatched non-main ref fails before OIDC issues creds.
      - name: Refuse to deploy a non-main ref
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Deploy is restricted to main; got ${GITHUB_REF}."
          exit 1

      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      # CodeBuild stores its buildspec in the project configuration rather than
      # reading it from the source archive. Refuse to deploy when that live
      # configuration has not caught up with the tracked Terraform input.
      - name: Verify CodeBuild buildspec is current
        run: |
          aws codebuild batch-get-projects \
            --names adamficke-com-site \
            --query 'projects[0].source.buildspec' \
            --output text > live-buildspec-site.yml
          diff --unified=3 buildspec-site.yml live-buildspec-site.yml

      - name: Build and deploy in AWS CodeBuild
        run: |
          git archive --format=zip --output=source.zip HEAD
          aws s3 cp source.zip "s3://adamficke-com-builds/source/${GITHUB_SHA}.zip" --only-show-errors
          BUILD_ID=$(aws codebuild start-build \
            --project-name adamficke-com-site \
            --source-type-override S3 \
            --source-location-override "adamficke-com-builds/source/${GITHUB_SHA}.zip" \
            --query 'build.id' --output text)
          echo "CodeBuild: ${BUILD_ID}"
          while true; do
            STATUS=$(aws codebuild batch-get-builds --ids "${BUILD_ID}" --query 'builds[0].buildStatus' --output text)
            case "${STATUS}" in
              SUCCEEDED) break ;;
              FAILED|FAULT|STOPPED|TIMED_OUT) exit 1 ;;
            esac
            sleep 5
          done
